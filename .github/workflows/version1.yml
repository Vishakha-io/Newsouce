name: "Node CI"

on:
  push:
    branches:
      - master

env:
  APP_MODE: development

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Show environment
        run: echo "$APP_MODE"

      - name: Verify GitHub Secret
        env:
          DEMO_TOKEN: ${{ secrets.DEMO_TOKEN }}
        run: |
            if [ -n "$DEMO_TOKEN" ]; then
              echo "Secret is available"
            else
              echo "Secret is missing"
              exit 1
            fi

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build
     
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: compiled-app
          path: hello.js
          if-no-files-found: error
  test:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Download compiled application
        uses: actions/download-artifact@v4
        with:
          name: compiled-app

      - name: Run compiled application
        run: node hello.js

      - name: Run tests
        run: npm test
