name: "Version2"

on:
  push:
    branches:
      - master

jobs:
  stage1: 
    runs-on: ubuntu-latest
    steps:
      - name: Files before checkout
        run: ls -la

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Files after checkout
        run: ls -la

      - name: Read original file
        run: cat original.txt

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check Node version
        run: node --version

      - name: Run tests
        run: node test.js
